
trigger:
  - none

pool:
  name: application

variables:
- group: owasp


stages:
  - stage: CI
    displayName: React Build and Publish
    jobs:
      - job: ReactBuild
        displayName: React Application Build

        steps:
          - checkout: self

          - task: Gitleaks@3
            displayName: Gitleaks
            inputs:
              scanlocation: '$(Build.SourcesDirectory)'
              configtype: 'default'
              reportformat: 'sarif'
              reportname: 'gitleakscan_report'
            continueOnError: true

          # Install dependencies
          - script: npm install
            displayName: Install Dependencies

          - task: Npm@1
            displayName: 'NPM audit'
            continueOnError: false
            inputs:
              command: 'custom'
              workingDir: '$(Build.SourcesDirectory)'
              customCommand: 'audit --audit-level=high'
          - task: SonarQubePrepare@8
            displayName: 'Prepare SonarQube Analysis'
            inputs:
              SonarQube: 'Sonarqube'
              scannerMode: 'cli'
              configMode: 'manual'
              cliProjectKey: 'react-app'
              cliProjectName: 'React App'
              cliSources: 'src'
              extraProperties: |
                sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**

          - task: SonarQubeAnalyze@8
            displayName: 'Run SonarQube Analysis'

          - task: SonarQubePublish@8
            displayName: 'Publish SonarQube Quality Gate'
            inputs:
              pollingTimeoutSec: '300'
          
          - task: trivy@2
            displayName: 'Trivy Install'
            inputs:
              version: 'latest'

          - task: PowerShell@2
            displayName: 'Trivy File System Scan'
            inputs:
              targetType: 'inline'
              script: |
                trivy fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL .

          


          # Build React application
          - script: npm run build
            displayName: Build React App

          # Publish build as artifact
          - task: PublishPipelineArtifact@1
            displayName: Publish React Artifact
            inputs:
              targetPath: '$(Build.SourcesDirectory)/build'
              artifact: 'react-build'
              publishLocation: 'pipeline'
          - task: dependency-check-build-task@6
            displayName: OWASP Dependency Check
            inputs:
              projectName: 'React App'
              scanPath: '.'
              format: 'HTML'
              uploadReports: true
              nvdApiKey: '$(NVD_API_KEY)'


  - stage: CD
    displayName: Deploy to NginxVm
    dependsOn: CI
    condition: succeeded()

    jobs:
    - job: Deploy
      displayName: Deploy React to Linux VM

      steps:

      - checkout: none

      # Download React Artifact
      - task: DownloadPipelineArtifact@2
        displayName: Download React Artifact
        inputs:
          buildType: 'current'
          artifactName: 'react-build'
          targetPath: '$(Pipeline.Workspace)/react-build'

      # Copy React files to Linux VM
      - task: CopyFilesOverSSH@0
        displayName: Copy React Files to Linux VM
        inputs:
          sshEndpoint: 'Linux-VM-SSH'
          sourceFolder: '$(Pipeline.Workspace)/react-build'
          contents: '**'
          targetFolder: '/tmp/react-build'
          cleanTargetFolder: true
          overwrite: true

      # Deploy to Nginx
      - task: SSH@0
        displayName: Deploy React to Nginx
        inputs:
          sshEndpoint: 'Linux-VM-SSH'
          runOptions: 'inline'
          inline: |
            sudo cp -a /tmp/react-build/. /var/www/html/
            sudo rm -f /var/www/html/index.nginx-debian.html
            sudo nginx -t
            sudo systemctl reload nginx
          failOnStdErr: false